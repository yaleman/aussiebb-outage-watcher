---
name: ty

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  mypy: # don't rename, used for branch rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: "true"
          github-token: ${{ github.token }}
      - name: Running ty check
        run: |
          uv run ty check

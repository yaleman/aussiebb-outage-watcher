[project]
name = "aussiebb_outage_watcher"
version = "0.2.0"
authors = [{ name = "James Hodgkinson", email = "james@terminaloutcomes.com" }]
description = "Basically what it says on the tin!"
requires-python = "<4.0,>=3.13"
dependencies = ["pydantic>=2.14.4", "schedule>=1.2.2", "pyaussiebb==0.1.6"]
readme = "README.md"

[project.scripts]
aussiebb-outage-watcher = "aussiebb_outage_watcher.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 200

[dependency-groups]
dev = ["ruff>=0.17", "pytest>=9.2", "coveralls>=4.1.0", "ty>=0.0.21"]
